{% extends 'base.html' %}

{% block content %}
<div class="container mt-5">

    <h2><i class="fas fa-heart"></i> Mes favoris</h2>

    {% if items %}
        <div class="row">
            {% for item in items %}
                <div class="col-md-4">
                    <div class="card p-3 mb-3">
                        <h5>{{ item.product.name }}</h5>
                        <p>{{ item.product.price }} €</p>

                        <a href="{% url 'product_detail' item.product.slug %}" class="btn btn-primary">
                            Voir produit
                        </a>
                    </div>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-muted">Aucun favori pour le moment</p>
    {% endif %}

</div>
{% endblock %}
