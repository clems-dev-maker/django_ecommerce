{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row">

        <div class="col-md-6">
            <img src="{{ product.image.url }}" class="img-fluid">
        </div>

        <div class="col-md-6">
            <h1>{{ product.name }}</h1>
            <p>{{ product.description }}</p>
            <p><strong>{{ product.price }} €</strong></p>

            <!-- PANIER -->
            <button class="btn btn-success add-to-cart" data-id="{{ product.id }}">
                <i class="fas fa-cart-plus"></i> Ajouter au panier
            </button>

            <!-- WISHLIST -->
            <button class="btn wishlist-btn 
                {% if product.id in user_wishlist %}btn-danger{% else %}btn-outline-danger{% endif %}"
                data-id="{{ product.id }}">

                <i class="fas fa-heart"></i>

                {% if product.id in user_wishlist %}
                    Retirer des favoris
                {% else %}
                    Ajouter aux favoris
                {% endif %}
            </button>
        </div>

    </div>

    <div class="mt-3">
        {% if product.stock > 0 %}
            <span class="badge bg-success">
                Stock disponible : {{ product.stock }}
            </span>
        {% else %}
            <span class="badge bg-danger">
                Rupture de stock
            </span>
        {% endif %}
    </div>
</div>
{% endblock %}
