{% extends 'base.html' %}

{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">

    <div class="card shadow-lg p-4" style="width: 420px;">
        
        <h3 class="text-center mb-4">
            <i class="fas fa-user-plus"></i> Inscription
        </h3>

        <form method="post" novalidate>
            {% csrf_token %}

            <!-- Username -->
            <div class="mb-3">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control {% if form.username.errors %}is-invalid{% endif %}" value="{{ form.username.value|default:'' }}">
                <div class="invalid-feedback">
                    {{ form.username.errors }}
                </div>
            </div>

            <!-- Email -->
            <div class="mb-3">
                <label>Email</label>
                <input type="email" name="email" class="form-control {% if form.email.errors %}is-invalid{% endif %}" value="{{ form.email.value|default:'' }}">
                <div class="invalid-feedback">
                    {{ form.email.errors }}
                </div>
            </div>

            <!-- Password -->
            <div class="mb-3">
                <label>Mot de passe</label>
                <input type="password" name="password1" class="form-control {% if form.password1.errors %}is-invalid{% endif %}">
                <div class="invalid-feedback">
                    {{ form.password1.errors }}
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="mb-3">
                <label>Confirmer le mot de passe</label>
                <input type="password" name="password2" class="form-control {% if form.password2.errors %}is-invalid{% endif %}">
                <div class="invalid-feedback">
                    {{ form.password2.errors }}
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                <i class="fas fa-user-check"></i> Créer un compte
            </button>
        </form>

        <hr>

        <p class="text-center">
            Déjà inscrit ?
            <a href="{% url 'login' %}">Connexion</a>
        </p>

    </div>
</div>
{% endblock %}
